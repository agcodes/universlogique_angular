<div class="canvas-container" [class]="canvasParams.styleClassContainer" [id]="canvasParams.id">
  <!-- Menu du canvas -->
  <app-canvas-menu
    *ngIf="showMenu"
    [canvasParams]="canvasParams"
    (actionToCanvas)="actionFromCanvas.emit($event)"
  ></app-canvas-menu>

  <!-- Canvas principal -->
  <canvas
    [id]="canvasParams.idElementCanvas"
    [class]="canvasParams.styleClassCanvas"
    (click)="handleClick($event)"
  ></canvas>

  <!-- Toast pour l'information d'enregistrement -->
  <div *ngIf="recordingInfo" class="toast-container position-absolute top-0 start-0 p-3">
    <div class="toast show">
      <div class="toast-header">
        <svg
          *ngIf="videoUrl"
          class="bd-placeholder-img rounded me-2"
          width="20"
          height="20"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
          preserveAspectRatio="xMidYMid slice"
          focusable="false"
        >
          <rect width="100%" height="100%" fill="#007aff"></rect>
        </svg>
        <svg
          *ngIf="!videoUrl"
          class="bd-placeholder-img rounded me-2"
          width="20"
          height="20"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
          preserveAspectRatio="xMidYMid slice"
          focusable="false"
        >
          <rect width="100%" height="100%" fill="red"></rect>
        </svg>
        <strong class="me-auto">{{ recordingInfo }}</strong>
        <button type="button" class="btn-close" (click)="recordingInfo = ''"></button>
      </div>
      <div *ngIf="videoUrl" class="toast-body">
        <a [href]="videoUrl" target="_blank" class="btn btn-secondary">WEBM</a>
        <a
          [href]="videoUrl"
          download="video-{{ canvasParams.idElementCanvas }}"
          class="btn btn-secondary"
          >DL</a
        >
      </div>
    </div>
  </div>

  <!-- Canvas hors écran -->
  <canvas class="d-none" [id]="canvasParams.idElementCanvasOffscreen"></canvas>
  <canvas class="d-none" [id]="canvasParams.idElementProcessCanvas"></canvas>
</div>
